# ----------------------------------------------------------------------
# Packaging
# https://packaging.python.org/en/latest/tutorials/packaging-projects/#choosing-a-build-backend
# ----------------------------------------------------------------------

[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

# ----------------------------------------------------------------------
# Hatchling
# https://pypi.org/project/hatchling/
# ----------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/jumplist_parser"]

# ----------------------------------------------------------------------
# uv
# https://github.com/astral-sh/uv
# ----------------------------------------------------------------------

[project]
name = "dfir-jumplist-parser"
version = "3.2.0"
description = "Parser for Jumplist."
authors = [
  {name = "ANSSI", email = "opensource@ssi.gouv.fr " }
]
maintainers = [
  {name = "ANSSI", email = "opensource@ssi.gouv.fr " }
]
license = "LGPL-2.1-or-later"
dependencies = [
  "orjson>=3.8.1",
  "olefile>=0.46",
  "LnkParse3==1.5.3",
  "typing_extensions~=4.15.0",
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["python", "forensic", "jumplist", "anssi"]

# See https://pypi.org/classifiers/
classifiers = [

  #"Development Status :: 1 - Planning",
  #"Development Status :: 2 - Pre-Alpha",
  #"Development Status :: 3 - Alpha",
  "Development Status :: 4 - Beta",
  #"Development Status :: 5 - Production/Stable",
  #"Development Status :: 6 - Mature",
  #"Development Status :: 7 - Inactive",

  # Default usage
  "Environment :: Console",

  # Framework used
  "Framework :: Pytest",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",

  # Target OS
  "Operating System :: OS Independent",

  # Version available for this project
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",

  # What is the language used in the project
  "Natural Language :: English",

  # The project is typed
  "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/ANSSI-FR/dfir-jumplist-parser"
Issues = "https://github.com/ANSSI-FR/dfir-jumplist-parser/issues"
Source = "https://github.com/ANSSI-FR/dfir-jumplist-parser"

[project.scripts]
jumplist-parser = "jumplist_parser.cli:entrypoint"

[dependency-groups]
dev = [
  # Task runner
  "poethepoet==0.37.0",

  # Pre-commit
  "pre-commit==4.3.0",
  "pre-commit-hooks==6.0.0",

  # Documentation
  "mkdocs==1.6.1",
  "mkdocstrings[python]==0.30.0",
  "pymdown-extensions==10.16.1",

  # Typer
  "mypy==1.17.1",

  # Linter
  "ruff==0.12.10",

  # Tests
  "coverage==7.10.5",
  "pytest-cov==6.2.1",
  "pytest==8.4.1",
  "pytest-mock==3.14.1",
]


# ----------------------------------------------------------------------
# Pytest
# https://docs.pytest.org
# ----------------------------------------------------------------------

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "ERROR"
addopts = "-vv --doctest-modules"
doctest_optionflags = "DONT_ACCEPT_TRUE_FOR_1 NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ELLIPSIS"


# ----------------------------------------------------------------------
# Coverage
# https://coverage.readthedocs.io/en/7.3.2/config.html
# ----------------------------------------------------------------------

[tool.coverage.run]
source = ["src/jumplist_parser"]


# ----------------------------------------------------------------------
# Mypy
# https://pypi.org/project/mypy
# ----------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "site",
]
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]

# Disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false  # All attribut of argparse.Namespace are Any
disallow_any_decorated = false  # Too many package doesn't have typed decorator
disallow_any_generics = true
disallow_subclassing_any = true

# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Too many decorator are untyped

# None and optional handling
no_implicit_optional = true

# Configuring warnings
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true

# Misc things
strict_equality = true

# Config file
warn_unused_configs = true

# Missing types
[[tool.mypy.overrides]]
module = ["LnkParse3.*", "olefile.*"]
ignore_missing_imports = true


# ----------------------------------------------------------------------
# Ruff
# https://pypi.org/project/ruff
# ----------------------------------------------------------------------

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
# D203 and D211 are incompatible
# D212 and D213 are incompatible
# D400 [*] First line should end with a period
# We dont use ANN : flake8-annotations because we already have mypy
# TD003 Missing issue link for this TODO
# FIX002 Line contains TODO, consider resolving the issue
# Use `@pytest.fixture()` over `@pytest.fixture`
# FBT001
ignore = ["D203", "D213", "D400", "ANN", "COM812", "ISC001", "TD003", "FIX002", "PT001", "FBT001"]
fixable = ["ALL"]
unfixable = []
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "site",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# E402 Module level import not at top of file
# INP001 File `docs\conf.py` is part of an implicit namespace package. Add an `__init__.py`.
# A001 Variable `copyright` is shadowing a python builtin
# PTH100 `os.path.abspath()` should be replaced by `Path.resolve()`
"docs/conf.py" = ["E402", "INP001", "A001", "PTH100"]
# S101 Use of `assert` detected
# S603 `subprocess` call: check for execution of untrusted input
# D102 undocumented-public-method
# D103 undocumented-public-function
"tests/*.py" = ["S101", "S603", "D102", "D103"]
"conftest.py" = ["S101", "S603", "D102", "D103"]
# Q003 [*] Change outer quotes to avoid escaping inner quotes
# E501 Line too long
"*/info.py" = ["Q003", "E501"]
# E501 Line too long
"*/__main__.py" = ["E501"]
# INP001 File `benchmarks/*.py` is part of an implicit namespace package. Add an `__init__.py`.
"benchmarks/*.py" = ["INP001"]
# INP001 File `scripts/*.py` is part of an implicit namespace package. Add an `__init__.py`.
# T201 `print` found
"scripts/*.py" = ["INP001", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["jumplist_parser"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 12.
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 10


# ----------------------------------------------------------------------
# Pylint
# https://pylint.pycqa.org/en/latest/index.html
# ----------------------------------------------------------------------

# Ruff replaces Pylint
[tool.pylint.main]
ignore-patterns = ["*"]


# ----------------------------------------------------------------------
# Black
# https://black.readthedocs.io/en/stable/
# ----------------------------------------------------------------------

# Ruff replaces Black
[tool.black]
exclude="*"
